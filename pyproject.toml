[project]
name = "jira-mcp"
version = "0.1.0"
description = "MCP server for Jira (Server/Data Center) via atlassian-python-api"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
    "atlassian-python-api>=3.41",
    "pydantic-settings>=2.0",
]

[project.urls]
Repository = "https://github.com/nsleader/jira-mcp"

[project.scripts]
jira-mcp = "jira_mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
